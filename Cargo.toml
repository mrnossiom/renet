[package]
name = "renet"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
nix = { version = "0.31", features = ["ioctl", "net"] }
serde = { version = "1", features = ["derive"] }
